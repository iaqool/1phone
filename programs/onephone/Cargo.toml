[package]
name = "onephone"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "onephone"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", features = ["token", "token_2022"] }
spl-token-2022 = "=8.0.1"
spl-token-group-interface = "=0.6.0"
